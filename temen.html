<!DOCTYPE html>
<html>
<head>
    <title>Gantengan gue apa lu?</title>
    <style>
        body {
            text-align: center; 
            padding-top: 100px; 
            font-family: Arial;
            background: linear-gradient(135deg, #ff9a9e, #fecfef);
            height: 100vh;
            overflow: hidden;
            margin: 0;
        }
        h1 {font-size: 32px; color: white; text-shadow: 2px 2px 4px #000;}
        button {
            padding: 15px 40px; 
            margin: 15px; 
            font-size: 20px; 
            cursor: pointer;
            border: none;
            border-radius: 12px;
            background: white;
            color: #ff1493;
            font-weight: bold;
            position: absolute;
            transition: 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        #gue {left: 25%; top: 50%;}
        #lu {left: 55%; top: 50%;}
    </style>
</head>
<body>
    <h1>Gantengan gue apa lu? 😏</h1>
    <button id="gue" onclick="alert('NAH KAN! Gue emang paling ganteng 🔥')">Gue</button>
    <button id="lu" ontouchstart="kabur()" onclick="kabur()">Lu</button>

    <script>
        function kabur() {
            let btn = document.getElementById('lu');
            let x = Math.random() * (window.innerWidth - 150);
            let y = Math.random() * (window.innerHeight - 150);
            btn.style.left = x + 'px';
            btn.style.top = y + 'px';
        }
    </script>
</body>
  </html>
